server.port=${PORT:8080}

spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/food_manager_db}
spring.datasource.username=${DB_USERNAME:fm_user}
spring.datasource.password=${DB_PASSWORD:fm_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=never

app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret}
app.food-safety-api-key=${FOODSAFETY_API_KEY:84bfd51958a44907a079}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173}
